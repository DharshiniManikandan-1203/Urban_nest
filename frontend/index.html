<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Nest | Multi-Venture Property & Community Management OS</title>
  <meta name="description" content="Next-generation multi-venture apartment management platform handling segregated blocks, floors, flats, unique owners, and dynamic amenities with hierarchical RBAC.">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Application CSS Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div id="app">
    <!-- Top Persona Quick Switcher Bar -->
    <div id="role-persona-bar" class="role-persona-bar"></div>

    <!-- App Shell -->
    <div class="app-shell">
      <!-- Sidebar Navigation -->
      <aside id="sidebar" class="sidebar"></aside>

      <!-- Main Content Stage -->
      <main class="main-wrapper">
        <!-- Top Navigation Header -->
        <header id="top-header" class="top-header"></header>

        <!-- Dynamic Viewport -->
        <section id="view-container" class="content-viewport"></section>
      </main>
    </div>

    <!-- Global Toast Notifications Container -->
    <div id="toast-container"></div>
  </div>

  <!-- Main ES Module Application Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
